<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152c">
  <meta name="description" content="HemoSync — AI-powered blood rescue and coordination network.">
  <title>HemoSync | Connecting Blood. Saving Lives.</title>

  <!-- The same logo is used as the browser tab icon and the visible brand logo. -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">

  <style>
    :root {
      --white: #fff;
      --muted: rgba(255,255,255,.82);
      --glass: rgba(5, 18, 42, .38);
      --accent: #ff3155;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #07152c;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #07152c;
    }

    .scene-background,
    .scene-shade,
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-background {
      z-index: -4;
      background-image: url("{{ url_for('static', filename='images/background_computer.png') }}");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: scale(1.015);
    }

    .scene-shade {
      z-index: -3;
      background:
        linear-gradient(180deg, rgba(3, 13, 33, .48) 0%, rgba(3, 13, 33, .12) 45%, rgba(3, 13, 33, .58) 100%),
        linear-gradient(90deg, rgba(3, 13, 33, .20), transparent 55%, rgba(3, 13, 33, .15));
    }

    /* The video is an atmospheric hero layer, not a replacement for the background. */
    .hero-video {
      z-index: -2;
      object-fit: cover;
      object-position: center;
      opacity: .84;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      width: 100%;
      padding: clamp(18px, 3vw, 34px) clamp(20px, 5vw, 72px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      text-decoration: none;
      font-size: clamp(21px, 2.1vw, 29px);
      font-weight: 800;
      letter-spacing: -.8px;
      text-shadow: 0 2px 18px rgba(0,0,0,.25);
    }

    .brand img {
      display: block;
      width: clamp(38px, 4vw, 50px);
      height: clamp(38px, 4vw, 50px);
      object-fit: contain;
      border-radius: 12px;
    }

    .hero-content {
      z-index: 1;
      width: min(900px, 92%);
      padding: 100px 20px 70px;
      text-align: center;
      text-shadow: 0 2px 22px rgba(0,0,0,.35);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: var(--glass);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4968;
      box-shadow: 0 0 14px #ff4968;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 88px);
      line-height: .98;
      font-weight: 850;
      letter-spacing: -3px;
    }

    h1 span {
      color: #ff536d;
    }

    .tagline {
      max-width: 650px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.65;
    }

    .loading-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      margin-top: 42px;
    }

    .loading-track {
      width: min(220px, 55vw);
      height: 4px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.28);
      box-shadow: 0 0 18px rgba(255,255,255,.12);
    }

    .loading-progress {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff3155, #fff, #59caff);
      box-shadow: 0 0 14px rgba(255,255,255,.8);
      animation: loading 1.8s ease-in-out infinite;
    }

    .loading-label {
      color: rgba(255,255,255,.88);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .footer-note {
      position: absolute;
      z-index: 2;
      bottom: 22px;
      left: 20px;
      right: 20px;
      color: rgba(255,255,255,.78);
      font-size: 11px;
      letter-spacing: 1.3px;
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes loading {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }

    @media (max-width: 767px) {
      .scene-background {
        background-image: url("{{ url_for('static', filename='images/background_mobile.png') }}");
        background-position: center center;
      }

      .hero-video {
        object-position: center center;
        opacity: .72;
      }

      .topbar {
        padding: 18px 20px;
      }

      .hero-content {
        width: 100%;
        padding: 105px 22px 85px;
      }

      h1 {
        letter-spacing: -1.8px;
        font-size: clamp(43px, 12vw, 66px);
      }

      .tagline {
        max-width: 440px;
        font-size: 15px;
      }

      .footer-note {
        bottom: 17px;
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-progress { animation-duration: 5s; }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="scene-background" aria-hidden="true"></div>
    <div class="scene-shade" aria-hidden="true"></div>

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="{{ url_for('static', filename='images/background_computer.png') }}"
      aria-hidden="true">
      <source src="{{ url_for('static', filename='videos/hero.mp4') }}" type="video/mp4">
    </video>

    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}" aria-label="HemoSync home">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HemoSync logo">
        <span>HemoSync</span>
      </a>
    </header>

    <section class="hero-content" aria-labelledby="hero-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> AI-powered blood rescue network</div>
      <h1 id="hero-title">Connecting Blood.<br><span>Saving Lives.</span></h1>
      <p class="tagline">
        Bringing donors, hospitals, and blood banks together through intelligent
        coordination — when every second matters.
      </p>

      <div class="loading-area" role="status" aria-live="polite">
        <div class="loading-track"><div class="loading-progress"></div></div>
        <div class="loading-label">Preparing your experience</div>
      </div>
    </section>

    <div class="footer-note">Every Drop. Every Second. Every Life.</div>
  </main>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
          window.location.href = "{{ url_for('home') }}";
      }, 5000);
    });
    // Some browsers may delay autoplay. This retries playback after page load.
    const heroVideo = document.querySelector(".hero-video");
    window.addEventListener("load", () => {
      if (heroVideo) {
        heroVideo.muted = true;
        const playAttempt = heroVideo.play();
        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(() => {
            // Autoplay can be restricted by browser/device settings.
          });
        }
      }
    });
  </script>
</body>
</html>
